[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issuehub"
version = "0.2.0"
description = "Concurrency-safe, multi-project issue tracker on MongoDB with idempotent creates, optimistic locking and cursor pagination"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "pymongo>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["issuehub"]
